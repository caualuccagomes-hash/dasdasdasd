<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
 <defs>
  <radialGradient id="cloud"><stop stop-color="#fff6e7" stop-opacity=".9"/><stop offset=".28" stop-color="#eee2ce" stop-opacity=".72"/><stop offset=".57" stop-color="#d5c4ad" stop-opacity=".38"/><stop offset="1" stop-color="#d5c4ad" stop-opacity="0"/></radialGradient>
